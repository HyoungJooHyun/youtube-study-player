<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 순차 학습 플레이어</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .aspect-video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .aspect-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-wrap justify-between items-center gap-2 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-indigo-600/20 rounded-lg text-indigo-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">유튜브 순차 학습 플레이어</h1>
        <span class="text-xs text-indigo-300 font-medium">탐색기형 스마트 커리큘럼</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openImportModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition font-bold shadow-sm">
        ➕ 강좌/링크 수집하기
      </button>
      <button onclick="exportProgress()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition font-medium border border-slate-600">
        💾 세이브 다운
      </button>
      <button onclick="document.getElementById('fileInput').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition font-medium border border-slate-600">
        📂 세이브 로드
      </button>
      <input type="file" id="fileInput" accept=".json" onchange="importProgress(event)" class="hidden">
      <button onclick="sharePlayer()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition font-medium border border-slate-600">
        🔗 공유하기
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-7xl mx-auto w-full">
    
    <!-- Left: Player Section (7 cols) -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      <div class="bg-black rounded-xl shadow-2xl overflow-hidden border border-slate-800">
        <div class="aspect-video-container">
          <div id="player"></div>
        </div>
      </div>

      <!-- Player Controls -->
      <div class="bg-slate-800/90 backdrop-blur rounded-xl p-4 border border-slate-700/60 shadow-lg">
        <div class="flex flex-col gap-1 mb-3">
          <span id="currentStatus" class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">재생 준비 완료</span>
          <h2 id="currentTitle" class="text-base font-bold text-white line-clamp-2">강의를 선택해 주세요</h2>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-slate-700/50">
          <button onclick="playPrev()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm px-4 py-2 rounded-lg flex items-center gap-1.5 transition font-medium">
            ◀ 이전
          </button>
          <button id="completeBtn" onclick="toggleCompleteCurrent()" class="bg-emerald-900/40 text-emerald-300 hover:bg-emerald-800/50 border border-emerald-500/40 text-sm px-4 py-2 rounded-lg flex items-center gap-1.5 transition font-medium">
            ✓ 수강 완료
          </button>
          <button onclick="playNext()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg flex items-center gap-1.5 font-medium transition">
            다음 ▶
          </button>
        </div>
      </div>

      <!-- AdSense Banner -->
      <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center min-h-[90px] text-center">
        <span class="text-xs text-slate-500 mb-1">광고 영역 (AdSense 728x90)</span>
        <ins class="adsbygoogle"
             style="display:block; width:100%; height:90px;"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="1234567890"
             data-ad-format="horizontal"></ins>
      </div>
    </section>

    <!-- Right: Explorer Playlist Section (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      <div class="bg-slate-800/90 backdrop-blur rounded-xl p-4 border border-slate-700/60 shadow-lg flex-1 flex flex-col">
        
        <!-- Folder Explorer Navigation Header -->
        <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-700/60">
          <div id="categoryTabContainer" class="flex gap-1 overflow-x-auto custom-scrollbar flex-1 mr-2">
            <!-- 동적으로 추가된 폴더 탭이 생성됨 -->
          </div>
          <button onclick="promptCreateCategory()" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg text-indigo-300 font-bold whitespace-nowrap border border-slate-600 flex items-center gap-1">
            📁 새 폴더
          </button>
        </div>

        <!-- Progress Header & Controls -->
        <div class="flex flex-col gap-2 mb-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-200 text-sm flex items-center gap-1.5">
              <span id="currentFolderIcon">📁</span> <span id="categoryTitle">전체 탐색기</span>
            </h3>
            <span id="progressText" class="text-xs text-slate-400 font-mono">0 / 0 (0%)</span>
          </div>

          <!-- Total Count Badge -->
          <div class="flex justify-between items-center text-xs text-slate-400 bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
            <span>총 수집 강좌: <strong id="totalCountBadge" class="text-indigo-400">0</strong>개</span>
            <span id="categoryCountBadge" class="text-slate-400 text-[11px]">현재 폴더: 0개</span>
          </div>

          <!-- Progress Bar -->
          <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
            <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
          </div>

          <!-- Expanded Sort Modes -->
          <div class="pt-1">
            <select id="sortOption" onchange="renderPlaylist()" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg p-2 w-full focus:outline-none focus:border-indigo-500">
              <option value="natural-asc">🔢 자연어 오름차순 (1 ➔ 2 ➔ 10 정렬)</option>
              <option value="natural-desc">🔢 자연어 내림차순 (10 ➔ 2 ➔ 1 정렬)</option>
              <option value="original">📋 수집 등록 순서대로</option>
              <option value="recent">🔄 최근 등록한 순서대로</option>
              <option value="random">🔀 무작위 셔플 (복습/기출용)</option>
            </select>
          </div>
        </div>

        <!-- Video Item List -->
        <div id="playlistContainer" class="flex-1 overflow-y-auto max-h-[420px] space-y-2 pr-1 custom-scrollbar">
        </div>

      </div>

      <!-- AdSense Sidebar Slot -->
      <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center min-h-[180px] text-center">
        <span class="text-xs text-slate-500 mb-1">광고 영역 (AdSense 300x250)</span>
        <ins class="adsbygoogle"
             style="display:block; width:100%; height:180px;"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="0987654321"
             data-ad-format="rectangle"></ins>
      </div>
    </section>
  </main>

  <!-- 수집 및 URL 입력 모달 (Modal) -->
  <div id="importModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 max-w-lg w-full shadow-2xl flex flex-col gap-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          📥 강좌 대량 수집 및 폴더 지정
        </h3>
        <button onclick="closeImportModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs text-slate-300 font-medium">1. 수집 대상 저장 폴더 선택</label>
        <select id="modalCategorySelect" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 p-2.5 rounded-lg focus:border-indigo-500 outline-none">
          <!-- 동적 폴더 목록이 들어감 -->
        </select>
      </div>

      <!-- 멤버십 영상 제외 설정 토글 -->
      <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/60 flex items-center justify-between">
        <div class="flex flex-col">
          <span class="text-xs font-bold text-slate-200">🔒 멤버십(유료 회원 전용) 영상 제외</span>
          <span class="text-[11px] text-slate-400">제목에 '멤버십', '회원전용' 포함 시 자동 걸러냄 (기본: 제외)</span>
        </div>
        <input type="checkbox" id="excludeMembershipCheck" checked class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs text-slate-300 font-medium">
          2. 유튜브 URL 또는 커뮤니티 글 붙여넣기 
          <span class="text-slate-500 font-normal">(글 뭉치 전체 복사 후 붙여넣기 가능)</span>
        </label>
        <textarea id="modalTextInput" rows="5" placeholder="예시:&#10;1. 데이터 통신 기초 - https://www.youtube.com/watch?v=M7lc1UVf-VE&#10;2. 전송 매체 - https://youtu.be/dQw4w9WgXcQ&#10;10. OSI 7계층 - https://youtu.be/fJ9rUzIMcZQ" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 p-3 rounded-lg focus:border-indigo-500 outline-none font-mono custom-scrollbar"></textarea>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700">
        <button onclick="clearAllVideos()" class="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-1 font-medium">
          🗑️ 전체 강좌 초기화
        </button>
        <div class="flex gap-2">
          <button onclick="closeImportModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-4 py-2 rounded-lg font-medium">취소</button>
          <button onclick="processImportText()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-bold">🚀 수집 실행</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 완전 깨끗한 데이터 (0개로 시작)
    let allVideos = JSON.parse(localStorage.getItem('custom_all_videos') || '[]');
    let categories = JSON.parse(localStorage.getItem('custom_categories') || '[]');
    
    let player;
    let currentIndex = 0;
    let currentCategory = 'all';
    let completedList = JSON.parse(localStorage.getItem('completed_videos') || '[]');

    function onYouTubeIframeAPIReady() {
      renderCategories();
      const filtered = getFilteredVideos();
      player = new YT.Player('player', {
        videoId: filtered[0]?.id || '',
        events: { 'onStateChange': onPlayerStateChange }
      });
      renderPlaylist();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        markCurrentCompleted();
        playNext();
      }
    }

    function renderCategories() {
      const tabContainer = document.getElementById('categoryTabContainer');
      const selectContainer = document.getElementById('modalCategorySelect');
      
      tabContainer.innerHTML = '';
      selectContainer.innerHTML = '';

      // 전체 탭
      const allTab = document.createElement('button');
      allTab.onclick = () => selectCategory('all');
      allTab.id = 'tab-all';
      allTab.className = `category-tab px-3 py-1.5 text-xs rounded-lg font-medium whitespace-nowrap ${currentCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
      allTab.innerText = '📂 전체 보기';
      tabContainer.appendChild(allTab);

      // 사용자 동적 폴더 탭 생성
      categories.forEach(cat => {
        const tabWrapper = document.createElement('div');
        tabWrapper.className = 'flex items-center gap-1 bg-slate-700 rounded-lg pr-1';
        if (currentCategory === cat) tabWrapper.className = 'flex items-center gap-1 bg-indigo-600 rounded-lg pr-1';

        const tab = document.createElement('button');
        tab.onclick = () => selectCategory(cat);
        tab.id = `tab-${cat}`;
        tab.className = `category-tab px-3 py-1.5 text-xs font-medium whitespace-nowrap ${currentCategory === cat ? 'text-white' : 'text-slate-300 hover:text-white'}`;
        tab.innerText = `📁 ${cat}`;
        tabWrapper.appendChild(tab);

        // 폴더 삭제 버튼 (x)
        const delBtn = document.createElement('button');
        delBtn.onclick = (e) => { e.stopPropagation(); deleteCategory(cat); };
        delBtn.className = 'text-xs text-slate-400 hover:text-rose-400 px-1 font-bold';
        delBtn.innerText = '×';
        tabWrapper.appendChild(delBtn);

        tabContainer.appendChild(tabWrapper);

        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = `📁 ${cat}`;
        selectContainer.appendChild(opt);
      });
    }

    function promptCreateCategory() {
      const name = prompt('새로 만드실 폴더(과목) 이름을 입력하세요:', '');
      if (name && name.trim()) {
        const trimmed = name.trim();
        if (!categories.includes(trimmed)) {
          categories.push(trimmed);
          localStorage.setItem('custom_categories', JSON.stringify(categories));
          renderCategories();
          selectCategory(trimmed);
        } else {
          alert('이미 존재하는 폴더 이름입니다.');
        }
      }
    }

    function deleteCategory(catName) {
      if (confirm(`'${catName}' 폴더를 삭제하시겠습니까? (안에 포함된 강좌도 함께 삭제됩니다)`)) {
        categories = categories.filter(c => c !== catName);
        allVideos = allVideos.filter(v => v.category !== catName);
        localStorage.setItem('custom_categories', JSON.stringify(categories));
        localStorage.setItem('custom_all_videos', JSON.stringify(allVideos));
        selectCategory('all');
      }
    }

    function openImportModal() {
      if (categories.length === 0) {
        alert('먼저 [📁 새 폴더] 버튼을 눌러 강좌를 넣을 폴더를 하나 이상 작성해 주세요!');
        return;
      }
      renderCategories();
      document.getElementById('importModal').classList.remove('hidden');
      document.getElementById('importModal').classList.add('flex');
    }

    function closeImportModal() {
      document.getElementById('importModal').classList.remove('flex');
      document.getElementById('importModal').classList.add('hidden');
    }

    function processImportText() {
      const rawText = document.getElementById('modalTextInput').value;
      const targetCategory = document.getElementById('modalCategorySelect').value;
      const excludeMembership = document.getElementById('excludeMembershipCheck').checked;

      if (!rawText.trim()) {
        alert('유튜브 URL이나 텍스트를 입력해 주세요!');
        return;
      }

      const lines = rawText.split('\n');
      let addedCount = 0;
      let membershipSkipped = 0;

      lines.forEach(line => {
        if (!line.trim()) return;

        // 멤버십 감지 및 제외 체크
        const isMembership = /멤버십|회원전용|members-only/i.test(line);
        if (excludeMembership && isMembership) {
          membershipSkipped++;
          return;
        }
        
        const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = line.match(regExp);

        if (match && match[1]) {
          const vidId = match[1];
          let title = line.replace(/https?:\/\/[^\s]+/g, '').trim();
          if (!title) title = `수집 영상 (${vidId})`;

          if (!allVideos.some(v => v.id === vidId)) {
            allVideos.push({ id: vidId, title: title, category: targetCategory, isMembership: isMembership });
            addedCount++;
          }
        }
      });

      localStorage.setItem('custom_all_videos', JSON.stringify(allVideos));
      closeImportModal();
      document.getElementById('modalTextInput').value = '';
      
      selectCategory(targetCategory);
      let alertMsg = `🎉 성공! '${targetCategory}' 폴더에 총 ${addedCount}개의 동영상이 추가되었습니다.`;
      if (membershipSkipped > 0) alertMsg += `\n(🔒 멤버십 차단 필터로 ${membershipSkipped}개 제외됨)`;
      alert(alertMsg);
    }

    function clearAllVideos() {
      if (confirm('수집된 모든 강좌 목록을 초기화하시겠습니까?')) {
        allVideos = [];
        localStorage.setItem('custom_all_videos', JSON.stringify(allVideos));
        closeImportModal();
        renderPlaylist();
      }
    }

    function selectCategory(category) {
      currentCategory = category;
      currentIndex = 0;
      renderCategories();

      document.getElementById('categoryTitle').innerText = category === 'all' ? '전체 폴더' : `${category}`;

      const filtered = getFilteredVideos();
      if (filtered.length > 0 && player && player.loadVideoById) {
        player.loadVideoById(filtered[0].id);
      }
      renderPlaylist();
    }

    function getFilteredVideos() {
      let list = currentCategory === 'all' 
        ? [...allVideos] 
        : allVideos.filter(v => v.category === currentCategory);
      
      const sortType = document.getElementById('sortOption').value;

      if (sortType === 'natural-asc') {
        list.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));
      } else if (sortType === 'natural-desc') {
        list.sort((a, b) => b.title.localeCompare(a.title, undefined, { numeric: true, sensitivity: 'base' }));
      } else if (sortType === 'recent') {
        list.reverse();
      } else if (sortType === 'random') {
        list.sort(() => Math.random() - 0.5);
      }

      return list;
    }

    function renderPlaylist() {
      const videos = getFilteredVideos();
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';

      let completedCount = 0;

      document.getElementById('totalCountBadge').innerText = allVideos.length;
      document.getElementById('categoryCountBadge').innerText = `${currentCategory === 'all' ? '전체' : currentCategory}: ${videos.length}개`;

      if (videos.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-xs border border-dashed border-slate-800 rounded-lg">
            이 폴더에 수집된 강좌가 없습니다.<br><br>1. 먼저 상단 <strong class="text-indigo-400">[📁 새 폴더]</strong>로 폴더를 생성하세요.<br>2. <strong class="text-indigo-400">[➕ 강좌/링크 수집하기]</strong>로 유튜브 링크를 붙여넣으세요!
          </div>
        `;
      } else {
        videos.forEach((vid, idx) => {
          const isCompleted = completedList.includes(vid.id);
          const isActive = idx === currentIndex;
          if (isCompleted) completedCount++;

          const item = document.createElement('div');
          item.className = `p-3 rounded-lg border cursor-pointer transition flex items-center justify-between gap-2 ${
            isActive ? 'bg-indigo-950/80 border-indigo-500/80 text-white' : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-700/50'
          }`;
          item.onclick = () => playVideoIndex(idx);

          item.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-xs font-mono px-2 py-0.5 rounded ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}">${idx + 1}</span>
              <span class="text-sm font-medium truncate ${isCompleted ? 'line-through text-slate-500' : ''}">${vid.title}</span>
              ${vid.isMembership ? '<span class="text-[10px] bg-amber-900/80 text-amber-300 px-1.5 py-0.5 rounded border border-amber-600/40">멤버십</span>' : ''}
            </div>
            <span class="text-xs ${isCompleted ? 'text-emerald-400 font-bold' : isActive ? 'text-indigo-400' : 'text-slate-600'}">${isCompleted ? '✓ 완료' : isActive ? '▶ 재생중' : '대기'}</span>
          `;
          container.appendChild(item);
        });
      }

      if (videos[currentIndex]) {
        document.getElementById('currentTitle').innerText = videos[currentIndex].title;
        document.getElementById('currentStatus').innerText = `재생 중 (${currentIndex + 1}/${videos.length})`;
      } else {
        document.getElementById('currentTitle').innerText = '선택된 강좌가 없습니다.';
        document.getElementById('currentStatus').innerText = '대기 중';
      }

      const percent = videos.length > 0 ? Math.round((completedCount / videos.length) * 100) : 0;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressText').innerText = `${completedCount} / ${videos.length} (${percent}%)`;
    }

    function playVideoIndex(idx) {
      const videos = getFilteredVideos();
      if (idx >= 0 && idx < videos.length) {
        currentIndex = idx;
        player.loadVideoById(videos[currentIndex].id);
        renderPlaylist();
      }
    }

    function playNext() {
      const videos = getFilteredVideos();
      if (currentIndex < videos.length - 1) playVideoIndex(currentIndex + 1);
    }

    function playPrev() {
      if (currentIndex > 0) playVideoIndex(currentIndex - 1);
    }

    function toggleCompleteCurrent() {
      const videos = getFilteredVideos();
      const currentId = videos[currentIndex]?.id;
      if (!currentId) return;

      if (completedList.includes(currentId)) {
        completedList = completedList.filter(id => id !== currentId);
      } else {
        completedList.push(currentId);
      }
      localStorage.setItem('completed_videos', JSON.stringify(completedList));
      renderPlaylist();
    }

    function markCurrentCompleted() {
      const videos = getFilteredVideos();
      const currentId = videos[currentIndex]?.id;
      if (currentId && !completedList.includes(currentId)) {
        completedList.push(currentId);
        localStorage.setItem('completed_videos', JSON.stringify(completedList));
      }
    }

    function exportProgress() {
      const exportData = {
        videos: allVideos,
        categories: categories,
        completed: completedList
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `my_study_explorer_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importProgress(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.videos) {
            allVideos = imported.videos;
            localStorage.setItem('custom_all_videos', JSON.stringify(allVideos));
          }
          if (imported.categories) {
            categories = imported.categories;
            localStorage.setItem('custom_categories', JSON.stringify(categories));
          }
          if (imported.completed) {
            completedList = imported.completed;
            localStorage.setItem('completed_videos', JSON.stringify(completedList));
          }
          renderCategories();
          renderPlaylist();
          alert('세이브 파일(탐색기 폴더 + 강좌 목록 + 완강 기록)이 성공적으로 복구되었습니다!');
        } catch (err) {
          alert('올바른 세이브 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function sharePlayer() {
      navigator.clipboard.writeText(window.location.href);
      alert('현재 플레이어 주소가 복사되었습니다!');
    }
  </script>
</body>
</html>
